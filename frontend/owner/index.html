<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Владелец календаря · Календарь звонков</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/owner.css" />
  </head>
  <body>
    <main>
      <h1>Владелец календаря</h1>
      <form id="event-type-form">
        <label>
          Идентификатор
          <input name="id" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="intro-30"
            title="Строчные латинские буквы и цифры, одиночный дефис между частями" required />
        </label>
        <label>
          Название
          <input name="title" required />
        </label>
        <label>
          Описание
          <textarea name="description" required></textarea>
        </label>
        <label>
          Длительность, мин.
          <input name="durationMinutes" type="number" min="1" max="540" step="1" required />
        </label>
        <button type="submit">Создать тип встречи</button>
      </form>
      <p id="event-type-status" role="status"></p>
    </main>
    <script type="module" src="/src/owner.ts"></script>
  </body>
</html>
